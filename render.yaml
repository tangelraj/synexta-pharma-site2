services:
  - type: web
    name: synexta-pharma-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python synext_backend/manage.py collectstatic --noinput
    startCommand: python synext_backend/manage.py migrate && python synext_backend/manage.py bootstrap_admin && gunicorn --chdir synext_backend synexta_api.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/products/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: synexta-pharma-api.onrender.com,synexta-pharma-site-1.onrender.com,synexta-pharma-site1.onrender.com,synexta-pharma-site1-1.onrender.com
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
